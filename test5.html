<!DOCTYPE html>
<html lang="en">
<head>
    
</head>
<title>Document</title>
<body>
    <h1>inline form</h1>
    <form>
        <label>username</label>
        <input type="text">
        <label>password</label>
        <input type="password">
        <input type="submit">
    </form>
    <hr>
    <h1>Horizontal Form</h1>
    <form>
        <label>username</label>
        <input type="text"><br>
        <label>password</label>
        <input type="password"><br>
        <input type="submit"><br>
    </form>
    <h1> vertical Form</h1>
    <hr>
    <form>
        <label>username</label><br>
        <input type="text"><br>
        <label>password</label><br>
        <input type="password"><br>
        <input type="submit"><br>
    </form>
</body>
</html>
